gui:
  theme:
    activeBorderColor:
      - "#F38BA8"
      - bold
    inactiveBorderColor:
      - "#A6ADC8"
    optionsTextColor:
      - "#89B4FA"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475A"
    cherryPickedCommitFgColor:
      - "#F38BA8"
    unstagedChangesColor:
      - "#F38BA8"
    defaultFgColor:
      - "#CDD6F4"
    searchingActiveBorderColor:
      - "#F9E2AF"
    authorColors: {"Alok Nigam": "#B4BEFE"}
    branchColorPatterns: {"^master(/|$)": "#94E2D5", "^main(/|$)": "#94E2D5"}
git:
  branchLogCmd: "git log --color=always --pretty=\\\"%C(#89B4FA) %C(#F2CDCD)%h %Creset- %C(#CDD6F4) %s %C(#9399B2)\U000F051F %ar on %ah %C(#9399B2)<%C(#A6ADC8)%an %C(#9399B2) %ae%C(#9399B2)>%C(#89B4FA)%d\\\" {{branchName}} --"
