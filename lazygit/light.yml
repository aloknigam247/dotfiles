gui:
  theme:
    activeBorderColor:
      - "#D20F39"
      - bold
    inactiveBorderColor:
      - "#6C6F85"
    optionsTextColor:
      - "#1E66F5"
    selectedLineBgColor:
      - "#CCD0DA"
    cherryPickedCommitBgColor:
      - "#BCC0CC"
    cherryPickedCommitFgColor:
      - "#D20F39"
    unstagedChangesColor:
      - "#D20F39"
    defaultFgColor:
      - "#4C4F69"
    searchingActiveBorderColor:
      - "#DF8E1D"
    authorColors: {"Alok Nigam": "#7287FD"}
